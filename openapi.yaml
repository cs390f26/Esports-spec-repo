openapi: 3.0.3
info:
  title: eSports Reservation System API
  version: 1.0.0
  description:
    API for spaces, computers, equipment, games, and reservations. Demo version with no sign-in. Uses
    integer IDs and ISO 8601 timestamps. Games and reservation-equipment links extend the original database schema.
    Reservations use fixed 2-hour time blocks from 10:00 to 22:00 in the lounge's local time. A block is identified
    by a date and a start hour (10, 12, 14, 16, 18, or 20).
paths:
  /spaces:
    get:
      summary: List spaces
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Space" } }
  /computers:
    get:
      summary: List computers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Computer" },
                }
  /equipment:
    get:
      summary: List equipment
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Equipment" },
                }
  /games:
    get:
      summary: List games
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Game" } }
  /time-blocks:
    get:
      summary: List time blocks for a date
      description: Returns the six bookable blocks for the date, in start order.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/TimeBlock" },
                }
        "400": { $ref: "#/components/responses/Error" }
  /time-blocks/current:
    get:
      summary: Get the current time block
      description:
        Returns the block in progress now. Outside lounge hours, returns the next block with in_progress set to
        false. Used by the landing page.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeBlock" }
  /spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Update space
      description: Updates supplied fields only. Existing reservations are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpaceUpdate" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /computers/{computerId}:
    parameters:
      - name: computerId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Update computer
      description: Updates supplied fields only. Existing reservations are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputerUpdate" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Computer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /equipment/{equipmentId}:
    parameters:
      - name: equipmentId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Update equipment
      description: Updates supplied fields only. Existing reservations are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentUpdate" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /availability:
    get:
      summary: Check availability for a time block
      description: Returns bookable spaces and equipment for the block. A snapshot, not a hold; booking rechecks availability.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: start_hour
          in: query
          required: true
          schema: { $ref: "#/components/schemas/StartHour" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/Error" }
  /reservations:
    get:
      summary: List reservations
      description: Newest first. Filters are optional; active_only returns confirmed sessions currently in progress.
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
        - name: space_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: active_only
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Reservation" },
                }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a reservation
      description:
        Submit after user confirmation. The request names a time block (date + start_hour); the server derives
        start_time and end_time. The block must not have started. The space must be active, the game supported, and
        all resources free for that block. Reject a second confirmed booking of the same resource in the same block;
        back-to-back blocks are allowed. Check and book resources atomically. Return 400 for invalid input, 404 for missing resources, or 409 for unavailable resources.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservation" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get a reservation
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/Error" }
  /reservations/{reservationId}/cancel:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Cancel a reservation
      description:
        Cancel before end_time and release the space and equipment. Already-cancelled bookings return
        200; ended bookings return 409. History is retained.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Request failed. See code and message for details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Space:
      type: object
      required: [space_id, space_name, description, is_active]
      additionalProperties: false
      properties:
        space_id: { type: integer, minimum: 1 }
        space_name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
    Computer:
      type: object
      required: [computer_id, space_id, hostname, specs, status]
      additionalProperties: false
      properties:
        computer_id: { type: integer, minimum: 1 }
        space_id: { type: integer, minimum: 1 }
        hostname: { type: string }
        specs: { type: string, nullable: true }
        status:
          { type: string, enum: [AVAILABLE, IN_USE, MAINTENANCE, OFFLINE] }
    Equipment:
      type: object
      required: [equipment_id, item_name, category, serial_number, status]
      additionalProperties: false
      properties:
        equipment_id: { type: integer, minimum: 1 }
        item_name: { type: string }
        category: { type: string, enum: [HEADSET, CONTROLLER] }
        serial_number: { type: string, nullable: true }
        status:
          { type: string, enum: [AVAILABLE, IN_USE, MAINTENANCE, OFFLINE] }
    Game:
      type: object
      required: [game_id, name, is_active, space_ids]
      additionalProperties: false
      properties:
        game_id: { type: integer, minimum: 1 }
        name: { type: string }
        is_active: { type: boolean }
        space_ids: { type: array, items: { type: integer }, uniqueItems: true }
    SpaceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        space_name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
    ComputerUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        hostname: { type: string }
        specs: { type: string, nullable: true }
        status:
          { type: string, enum: [AVAILABLE, IN_USE, MAINTENANCE, OFFLINE] }
    EquipmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        item_name: { type: string }
        category: { type: string, enum: [HEADSET, CONTROLLER] }
        serial_number: { type: string, nullable: true }
        status:
          { type: string, enum: [AVAILABLE, IN_USE, MAINTENANCE, OFFLINE] }
    StartHour:
      type: integer
      enum: [10, 12, 14, 16, 18, 20]
      description: Start hour of a 2-hour block, in the lounge's local time.
    TimeBlock:
      type: object
      required: [date, start_hour, end_hour, start_time, end_time]
      properties:
        date: { type: string, format: date }
        start_hour: { $ref: "#/components/schemas/StartHour" }
        end_hour: { type: integer, enum: [12, 14, 16, 18, 20, 22] }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        in_progress:
          type: boolean
          description: Only on /time-blocks/current. False when the lounge is closed and this is the next block.
    CreateReservation:
      type: object
      additionalProperties: false
      required: [user_id, space_id, game_id, date, start_hour]
      properties:
        user_id: { type: string, minLength: 1 }
        space_id: { type: integer, minimum: 1 }
        game_id: { type: integer, minimum: 1 }
        equipment_ids:
          {
            type: array,
            items: { type: integer, minimum: 1 },
            uniqueItems: true,
            default: [],
          }
        date: { type: string, format: date }
        start_hour: { $ref: "#/components/schemas/StartHour" }
    Reservation:
      type: object
      required:
        [
          reservation_id,
          user_id,
          space_id,
          game_id,
          equipment_ids,
          start_time,
          end_time,
          status,
          created_at,
        ]
      properties:
        reservation_id: { type: integer }
        user_id: { type: string, minLength: 1 }
        space_id: { type: integer, minimum: 1 }
        game_id: { type: integer, minimum: 1 }
        equipment_ids:
          {
            type: array,
            items: { type: integer, minimum: 1 },
            uniqueItems: true,
            default: [],
          }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMED, CANCELLED, COMPLETED] }
        created_at: { type: string, format: date-time }
    Availability:
      type: object
      required: [space_ids, equipment_ids]
      properties:
        space_ids: { type: array, items: { type: integer } }
        equipment_ids: { type: array, items: { type: integer } }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: SPACE_BOOKED }
        message:
          {
            type: string,
            example: This space is already booked during the selected time.,
          }
